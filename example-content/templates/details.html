{{define "content"}}
<article id="article-content">
  <h1 class="title">{{.Title}}</h1>
  <time class="date" datetime="{{.PublicationDate.Format "2006-01-02"}}">{{.PublicationDate.Format "Jan 02, 2006"}}</time>
  <div class="text">{{.Content}}</div>
  <hr />
  <div class="everything">Example extra: {{index (index .Extras "example") "something"}}</div>
</article>
{{end}}
