{{define "content"}}
<ul id="articles-list">
    {{range .Stories}}
    <li>
        <a class="title" href="/{{.Path}}">{{.Story.Title}}</a>
        <time class="date" datetime="{{.Story.PublicationDate.Format "2006-01-02"}}">{{.Story.PublicationDate.Format "Jan 02, 2006"}}</time>
        {{if .Story.Category}}<div class="category">{{.Story.Category}}</div>{{end}}
    </li>
    {{end}}
</ul>
{{end}}
